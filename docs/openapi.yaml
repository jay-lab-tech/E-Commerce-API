openapi: 3.0.3
info:
  title: E-Commerce API
  version: 0.1.0
  description: Modular REST API for catalog, cart, checkout, payments, and order management.
servers:
  - url: http://localhost:3001
    description: Local Docker Compose
tags:
  - name: Health
  - name: Categories
  - name: Products
  - name: Cart
  - name: Orders
  - name: Admin Orders
paths:
  /health:
    get:
      tags: [Health]
      summary: Check API and dependency health
      responses:
        '200':
          description: All dependencies are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: One or more dependencies are unavailable

  /api/categories:
    get:
      tags: [Categories]
      summary: List active categories
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategories'
    post:
      tags: [Categories]
      summary: Create a category
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201': { $ref: '#/components/responses/CategoryResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/categories/{slug}:
    get:
      tags: [Categories]
      summary: Get an active category by slug
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200': { $ref: '#/components/responses/CategoryResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/categories/{id}:
    put:
      tags: [Categories]
      summary: Update a category
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryUpdate' }
      responses:
        '200': { $ref: '#/components/responses/CategoryResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Categories]
      summary: Soft-delete a category
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/CategoryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/products:
    get:
      tags: [Products]
      summary: List active products
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: category
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: string, pattern: '^\\d+(\\.\\d{1,2})?$' }
        - name: maxPrice
          in: query
          schema: { type: string, pattern: '^\\d+(\\.\\d{1,2})?$' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProducts'
    post:
      tags: [Products]
      summary: Create a product
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201': { $ref: '#/components/responses/ProductResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/products/{slug}:
    get:
      tags: [Products]
      summary: Get an active product by slug
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200': { $ref: '#/components/responses/ProductResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/products/{id}:
    put:
      tags: [Products]
      summary: Update a product by ID
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdate' }
      responses:
        '200': { $ref: '#/components/responses/ProductResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Products]
      summary: Soft-delete a product by ID
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/ProductResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/cart:
    get:
      tags: [Cart]
      summary: Get the authenticated user's cart
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Cart items
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CartItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Cart]
      summary: Clear the authenticated user's cart
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/DeletedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/cart/items:
    post:
      tags: [Cart]
      summary: Add quantity to a cart product
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemInput' }
      responses:
        '201': { $ref: '#/components/responses/CartItemResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/cart/items/{productId}:
    patch:
      tags: [Cart]
      summary: Set the exact cart quantity
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1, maximum: 99 }
      responses:
        '200': { $ref: '#/components/responses/CartItemResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Cart]
      summary: Remove a product from the cart
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200': { $ref: '#/components/responses/CartItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/orders:
    post:
      tags: [Orders]
      summary: Checkout the authenticated user's cart
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shippingAddress]
              properties:
                shippingAddress: { type: string, minLength: 10, maxLength: 1000 }
      responses:
        '201': { $ref: '#/components/responses/OrderResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Orders]
      summary: List the authenticated user's orders
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Order list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrders'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Get an owned order
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/OrderResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/orders/{id}/pay:
    post:
      tags: [Orders]
      summary: Confirm a mock payment
      description: Idempotent for an order that is already paid.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/OrderResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/orders:
    get:
      tags: [Admin Orders]
      summary: List all orders for administrators
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/OrdersResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/orders/{id}/status:
    patch:
      tags: [Admin Orders]
      summary: Update an order status
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200': { $ref: '#/components/responses/OrderResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    Search:
      name: search
      in: query
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { type: object } }
    HealthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            service: { type: string, example: ecommerce-api }
            status: { type: string, example: ok }
            dependencies: { type: object, additionalProperties: { type: string } }
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
    CategoryUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
    Category:
      allOf:
        - $ref: '#/components/schemas/CategoryInput'
        - type: object
          required: [id, isActive, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            isActive: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    ProductInput:
      type: object
      required: [categoryId, name, price]
      properties:
        categoryId: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 160 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        description: { type: string, nullable: true, maxLength: 5000 }
        price: { type: string, pattern: '^\\d+(\\.\\d{1,2})?$' }
        stock: { type: integer, minimum: 0, default: 0 }
        imageUrl: { type: string, format: uri, nullable: true }
    ProductUpdate:
      type: object
      minProperties: 1
      properties:
        categoryId: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 160 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        description: { type: string, nullable: true, maxLength: 5000 }
        price: { type: string, pattern: '^\\d+(\\.\\d{1,2})?$' }
        stock: { type: integer, minimum: 0 }
        imageUrl: { type: string, format: uri, nullable: true }
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          required: [id, slug, isActive, createdAt, updatedAt, category]
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            isActive: { type: boolean }
            category: { $ref: '#/components/schemas/Category' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    CartItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 99 }
    CartItem:
      allOf:
        - $ref: '#/components/schemas/CartItemInput'
        - type: object
          required: [id, userId, createdAt, updatedAt, product]
          properties:
            id: { type: string, format: uuid }
            userId: { type: string, format: uuid }
            product: { $ref: '#/components/schemas/Product' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    OrderStatus:
      type: string
      enum: [PENDING, PAID, PROCESSING, SHIPPED, COMPLETED, CANCELLED]
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        externalId: { type: string }
        method: { type: string, enum: [MOCK, MIDTRANS, XENDIT] }
        amount: { type: string }
        status: { type: string, enum: [PENDING, PAID, FAILED, EXPIRED, REFUNDED] }
        paidAt: { type: string, format: date-time, nullable: true }
    OrderItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        productName: { type: string }
        price: { type: string }
        quantity: { type: integer }
        subtotal: { type: string }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        orderNumber: { type: string }
        totalAmount: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentStatus: { type: string, enum: [PENDING, PAID, FAILED, EXPIRED, REFUNDED] }
        shippingAddress: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
        payment: { $ref: '#/components/schemas/Payment' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    PaginatedCategories:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Category' } }
        meta: { $ref: '#/components/schemas/Pagination' }
    PaginatedProducts:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Product' } }
        meta: { $ref: '#/components/schemas/Pagination' }
    PaginatedOrders:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Order' } }
        meta: { $ref: '#/components/schemas/Pagination' }
  responses:
    CategoryResponse:
      description: Category response
      content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Category' } } } } }
    ProductResponse:
      description: Product response
      content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Product' } } } } }
    CartItemResponse:
      description: Cart item response
      content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/CartItem' } } } } }
    OrderResponse:
      description: Order response
      content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Order' } } } } }
    OrdersResponse:
      description: Paginated order response
      content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedOrders' } } }
    DeletedResponse:
      description: Deletion result
      content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { deletedCount: { type: integer } } } } } } }
    ValidationError:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Authentication required or token invalid
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Admin role required
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Business rule or uniqueness conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
